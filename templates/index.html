<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Lyrics Dashboard</title>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dbeafe;
            color: #111;
        }

        header {
            background: #bfdbfe;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #60a5fa;
            color: white;
        }

        button:hover {
            background: #3b82f6;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
            padding: 10px;
        }

        .panel {
            background: #f1f5f9;
            border-radius: 10px;
            padding: 10px;
            height: 80vh;
            overflow-y: auto;
        }

        .job {
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 6px;
            background: #e2e8f0;
            font-size: 14px;
        }

        .job.done { background: #bbf7d0; }
        .job.error { background: #fecaca; }
        .job.processing { background: #fde68a; }

        .log {
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }

        .filter {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>🎵 Lyrics Dashboard</h1>

    <div class="controls">
        <button onclick="refresh()">Refresh</button>

        <label class="filter">
            <input type="checkbox" id="errorOnly" />
            Errors only
        </label>
    </div>
</header>

<div class="container">

    <div class="panel" id="jobs">
        <h3>Jobs</h3>
    </div>

    <div class="panel">
        <h3>Activity Log</h3>
        <div class="log" id="log"></div>
    </div>

</div>

<script>
    const socket = io({
        transports: ["websocket", "polling"]
    });

    let state = { jobs: [] };

    socket.on("connect", () => {
        log("Socket connected");
    });

    socket.on("disconnect", () => {
        log("Socket disconnected");
    });

    socket.on("update", (data) => {
        state = data;
        render();
    });

    function render() {
        const container = document.getElementById("jobs");
        const errorOnly = document.getElementById("errorOnly").checked;

        container.innerHTML = "<h3>Jobs</h3>";

        (state.jobs || []).forEach(job => {

            if (errorOnly && job.status !== "error") return;

            const div = document.createElement("div");
            div.className = "job " + (job.status || "");

            div.innerHTML = `
                <b>${job.title || "Unknown"}</b><br/>
                ${job.artist || ""}<br/>
                Status: ${job.status || "pending"}
            `;

            container.appendChild(div);
        });
    }

    function refresh() {
        socket.emit("refresh");
        log("Manual refresh triggered");
    }

    function log(msg) {
        const logBox = document.getElementById("log");
        const time = new Date().toLocaleTimeString();
        logBox.innerText += `[${time}] ${msg}\n`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById("errorOnly").addEventListener("change", render);
</script>

</body>
</html>
